fragment ArticlePage on ArticlePage {
    _metadata {
        ...PageUrl
        published
        displayName
    }
    PromoImage {
        ...ContentUrl
        ...ContentReferenceItem
    }
    Heading
    SubHeading
    Author
    Body {
        html
    }
    BottomContentHeader
    BottomContent {
        _metadata {
            types
        }
        ...ContentArea
    }
    SeoSettings {
        ...PageSeoSettingsProperty
    }
    PageAdminSettings {
        ...PageAdminSettingsProperty
    }
}
