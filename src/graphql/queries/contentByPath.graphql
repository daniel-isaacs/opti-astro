query contentByPath($base: String, $url: String!, $urlNoSlash: String!) {
    _Content(
        where: {
            _metadata: { url: { base: { eq: $base } } }
            _and: [
                # Authenticated (HMAC) requests can see draft/previous versions;
                # view-mode routing must only ever resolve the published one.
                { _metadata: { status: { eq: "Published" } } }
                {
                    _or: [
                        { _metadata: { url: { default: { eq: $url } } } }
                        { _metadata: { url: { default: { eq: $urlNoSlash } } } }
                        { _metadata: { url: { hierarchical: { eq: $url } } } }
                    ]
                }
            ]
        }
    ) {
        item {
            _metadata {
                key
                version
                locale
            }
        }
    }
}
